name: Vendor upstream PEV2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-pev2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install exact upstream standalone release
        run: |
          curl -fL --retry 3 https://github.com/dalibo/pev2/releases/download/v1.25.0/pev2.html -o /tmp/pev2.html
          echo 'a9c992a85aa111b4442ece08b1f1abcd92f5a651cb41fc9510a74ad4b3bba99f  /tmp/pev2.html' | sha256sum -c -
          cp /tmp/pev2.html projects/aster/native/index.html
          cp projects/licenses/pev2.txt projects/aster/native/LICENSE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/aster/native
          git diff --cached --quiet || (git commit -m 'Vendor unmodified PEV2 standalone v1.25.0' && git push origin HEAD:main)
