name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required site files and local references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          required = [
              'index.html', 'app.js', 'base.css', 'components.css', 'responsive.css',
              'experience.html', 'projects.html', 'skills.html', 'about.html',
              'contact.html', 'resume.html', '.nojekyll'
          ]
          missing = [p for p in required if not (root / p).exists()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')

          broken = []
          for html in root.glob('*.html'):
              text = html.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:href|src)="([^"]+)"', text):
                  if ref.startswith(('http:', 'https:', 'mailto:', '#', 'data:')):
                      continue
                  target = root / ref.split('#', 1)[0]
                  if ref and not target.exists():
                      broken.append((str(html), ref))
          if broken:
              raise SystemExit(f'Broken local references: {broken}')
          print('Static site checks passed.')
          PY
