name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check japan-world.js
          node --check tests/homepage.mjs
          node --check tests/project-labs.mjs
          find projects -name '*.js' ! -name 'wasm_exec.js' -print0 | xargs -0 -n1 node --check
          node tests/axon-engine.mjs
      - name: Check site files, nested references, and inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          root = Path('.')
          required = [
              'index.html', 'app.js', 'base.css', 'components.css', 'responsive.css',
              'experience.html', 'projects.html', 'skills.html', 'about.html',
              'contact.html', 'resume.html', '.nojekyll',
              'projects/demo.css',
              'projects/app-demo.css',
              'projects/kestrel/index.html',
              'projects/kestrel/wasm_exec.js',
              'projects/northstar/index.html',
              'projects/aster/index.html',
          ]
          missing = [p for p in required if not (root / p).exists()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')

          broken = []
          script_failures = []
          for html in root.rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:href|src)="([^"]+)"', text):
                  if ref.startswith(('http:', 'https:', 'mailto:', '#', 'data:', 'javascript:')):
                      continue
                  clean = ref.split('#', 1)[0].split('?', 1)[0]
                  if not clean:
                      continue
                  target = (html.parent / clean)
                  if clean.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      broken.append((str(html), ref))

              for i, script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I), start=1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as tmp:
                      tmp.write(script)
                      tmp_path = tmp.name
                  proc = subprocess.run(['node', '--check', tmp_path], capture_output=True, text=True)
                  Path(tmp_path).unlink(missing_ok=True)
                  if proc.returncode:
                      script_failures.append((str(html), i, proc.stderr.strip()))

          if broken:
              raise SystemExit(f'Broken local references: {broken}')
          if script_failures:
              raise SystemExit(f'Inline JavaScript syntax errors: {script_failures}')
          print('Static site checks passed.')
          PY

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and Playwright
        run: |
          npm install --prefix /tmp/portfolio-browser playwright@1.56.1
          /tmp/portfolio-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve the actual committed site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Exercise project workflows
        env:
          PLAYWRIGHT_MODULE: /tmp/portfolio-browser/node_modules/playwright/index.mjs
          ARTIFACT_DIR: /tmp/portfolio-review/projects
        run: node tests/project-labs.mjs
      - name: Exercise animated landing page
        if: always()
        env:
          PLAYWRIGHT_MODULE: /tmp/portfolio-browser/node_modules/playwright/index.mjs
          ARTIFACT_DIR: /tmp/portfolio-review/homepage
        run: node tests/homepage.mjs
      - name: Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-review
          path: /tmp/portfolio-review
          if-no-files-found: warn
