<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aster — PEV2 plan explorer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pev2@1.25.0/dist/pev2.css">
<style>body{margin:0;background:white;font-family:system-ui,sans-serif}.editor{border-bottom:1px solid #d8dee4;padding:14px 18px;background:#f8f9fa}.editor label{font-size:12px;font-weight:600}.editor textarea{font:12px/1.5 monospace;resize:vertical;min-height:90px}.editor p{font-size:12px;color:#53606d;margin:5px 0}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.controls select{width:auto;max-width:100%}#app{height:calc(100vh - 246px);min-height:440px}#app>div{min-height:100%;height:100%}#status{font-size:12px;color:#475569}details[open] summary{margin-bottom:10px}details summary{cursor:pointer;font-weight:600;font-size:14px}</style>
</head><body>
<section class="editor">
  <details open><summary>EXPLAIN input</summary><label for="plan">PostgreSQL EXPLAIN (FORMAT JSON), or text for visualization only</label>
  <textarea id="plan" class="form-control" rows="4" spellcheck="false">Aggregate  (cost=12.50..12.51 rows=1 width=8)
  -&gt;  Seq Scan on employees  (cost=0.00..10.00 rows=1000 width=0)</textarea>
  <p>Initial example: PEV2 documentation sample, not a measured Aster candidate. Paste your own JSON plan to import its estimates.</p>
  <div class="controls"><button id="visualize" class="btn btn-primary btn-sm" type="button">Visualize plan</button><select id="candidate" class="form-select form-select-sm" aria-label="Candidate receiving estimates"><option value="0">PostgreSQL default</option><option value="1">Index join</option><option value="2">Nested loop</option></select><button type="button" id="import" class="btn btn-outline-primary btn-sm">Import estimates into ranker</button></div>
  <div id="status" role="status" aria-live="polite">Loading PEV2…</div></details>
</section>
<div id="app" class="d-flex flex-column"><p class="p-3">Loading Dalibo plan visualization…</p></div>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pev2@1.25.0/dist/pev2.umd.js"></script>
<script src="./visualizer.js"></script>
</body></html>
